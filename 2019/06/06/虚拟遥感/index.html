ickMode == <span class="literal">false</span>)</span><br><span class="line">            &#123;</span><br><span class="line">                CheckKeyPress(KeyCode.UpArrow);</span><br><span class="line">                CheckKeyPress(KeyCode.DownArrow);</span><br><span class="line">                CheckKeyPress(KeyCode.LeftArrow);</span><br><span class="line">                CheckKeyPress(KeyCode.RightArrow);</span><br><span class="line"></span><br><span class="line">                CheckKeyRelease(KeyCode.UpArrow);</span><br><span class="line">                CheckKeyRelease(KeyCode.DownArrow);</span><br><span class="line">                CheckKeyRelease(KeyCode.LeftArrow);</span><br><span class="line">                CheckKeyRelease(KeyCode.RightArrow);</span><br><span class="line"></span><br><span class="line">                Vector2 tempValue = Vector2.zero;</span><br><span class="line">                <span class="keyword">if</span> (_pressedKeyCode.Count &gt; <span class="number">0</span>)</span><br><span class="line">                &#123;</span><br><span class="line">                    <span class="keyword">switch</span> (_pressedKeyCode[<span class="number">0</span>])</span><br><span class="line">                    &#123;</span><br><span class="line">                        <span class="keyword">case</span> KeyCode.UpArrow:</span><br><span class="line">                            tempValue = Vector2.up;</span><br><span class="line">                            <span class="keyword">break</span>;</span><br><span class="line">                        <span class="keyword">case</span> KeyCode.DownArrow:</span><br><span class="line">                            tempValue = Vector2.down;</span><br><span class="line">                            <span class="keyword">break</span>;</span><br><span class="line">                        <span class="keyword">case</span> KeyCode.LeftArrow:</span><br><span class="line">                            tempValue = Vector2.left;</span><br><span class="line">                            <span class="keyword">break</span>;</span><br><span class="line">                        <span class="keyword">case</span> KeyCode.RightArrow:</span><br><span class="line">                            tempValue = Vector2.right;</span><br><span class="line">                            <span class="keyword">break</span>;</span><br><span class="line">                    &#125;</span><br><span class="line">                &#125;</span><br><span class="line"></span><br><span class="line">                SetValue(tempValue);</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="function"><span class="keyword">void</span> <span class="title">SetValue</span>(<span class="params">Vector2 <span class="keyword">value</span></span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span> (_lastValue != <span class="keyword">value</span>)</span><br><span class="line">            &#123;</span><br><span class="line">                _lastValue = <span class="keyword">value</span>;</span><br><span class="line">                onValueChange?.Invoke(_lastValue);</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="function"><span class="keyword">void</span> <span class="title">CheckKeyPress</span>(<span class="params">KeyCode keyCode</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span> (Input.GetKeyDown(keyCode))</span><br><span class="line">            &#123;</span><br><span class="line">                _pressedKeyCode.Remove(keyCode);</span><br><span class="line">                _pressedKeyCode.Insert(<span class="number">0</span>, keyCode);</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="function"><span class="keyword">void</span> <span class="title">CheckKeyRelease</span>(<span class="params">KeyCode keyCode</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span> (!Input.GetKey(keyCode))</span><br><span class="line">            &#123;</span><br><span class="line">                _pressedKeyCode.Remove(keyCode);</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> 得到指定GameObject下，鼠标相对的localposition坐标</span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;/summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;param name=&quot;go&quot;&gt;</span><span class="doctag">&lt;/param&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;returns&gt;</span><span class="doctag">&lt;/returns&gt;</span></span></span><br><span class="line">        <span class="function">Vector2 <span class="title">GetLocalMousePosition</span>(<span class="params">GameObject go</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            <span class="keyword">if</span>(<span class="literal">null</span> == camera)</span><br><span class="line">            &#123;</span><br><span class="line">               Debug.LogError(<span class="string">&quot;Joystick need binding a camera&quot;</span>);</span><br><span class="line">            &#125;</span><br><span class="line"></span><br><span class="line">            Vector2 screenMouse = <span class="keyword">new</span> Vector2(Input.mousePosition.x, Input.mousePosition.y);</span><br><span class="line">            Vector2 localPoint;</span><br><span class="line">            RectTransformUtility.ScreenPointToLocalPointInRectangle(go.GetComponent&lt;RectTransform&gt;(), screenMouse, camera, <span class="keyword">out</span> localPoint);</span><br><span class="line"></span><br><span class="line">            <span class="comment">//Debug.LogFormat(&quot;Mouse:&#123;0&#125;  Screen:&#123;1&#125;  LocalPoint:&#123;2&#125;&quot;, Input.mousePosition, screenMouse, localPoint);</span></span><br><span class="line">            <span class="keyword">return</span> localPoint;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> 触摸开始的时候</span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;/summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;param name=&quot;e&quot;&gt;</span><span class="doctag">&lt;/param&gt;</span></span></span><br><span class="line">        <span class="function"><span class="keyword">public</span> <span class="keyword">void</span> <span class="title">OnPointerDown</span>(<span class="params">BaseEventData e</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            stickBorder.localPosition = GetLocalMousePosition(gameObject);</span><br><span class="line"></span><br><span class="line">            stickBorderGroup.alpha = <span class="number">0.4f</span>;</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> 滑动开始的时候</span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;/summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;param name=&quot;e&quot;&gt;</span><span class="doctag">&lt;/param&gt;</span></span></span><br><span class="line">        <span class="function"><span class="keyword">public</span> <span class="keyword">void</span> <span class="title">OnBeginDrag</span>(<span class="params">BaseEventData e</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            _isStickMode = <span class="literal">true</span>;</span><br><span class="line"></span><br><span class="line">            _touchStartPos = GetLocalMousePosition(stickBorder.gameObject);</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> 滑动中</span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;/summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;param name=&quot;e&quot;&gt;</span><span class="doctag">&lt;/param&gt;</span></span></span><br><span class="line">        <span class="function"><span class="keyword">public</span> <span class="keyword">void</span> <span class="title">OnDrag</span>(<span class="params">BaseEventData e</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            Vector2 touchNowPos = GetLocalMousePosition(stickBorder.gameObject);</span><br><span class="line"></span><br><span class="line">            <span class="keyword">var</span> moveVector = (touchNowPos - _touchStartPos);</span><br><span class="line"></span><br><span class="line">            <span class="keyword">if</span> (moveVector.magnitude &lt;= minRadius)</span><br><span class="line">            &#123;</span><br><span class="line">                <span class="keyword">return</span>;</span><br><span class="line">            &#125;</span><br><span class="line">            </span><br><span class="line">            moveVector = Vector3.ClampMagnitude(moveVector, maxRadius);</span><br><span class="line">           </span><br><span class="line">            stick.localPosition = moveVector;</span><br><span class="line"></span><br><span class="line">            Vector2 <span class="keyword">value</span> = <span class="keyword">new</span> Vector2(moveVector.x, moveVector.y);</span><br><span class="line"></span><br><span class="line">            SetValue(<span class="keyword">value</span>);</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> 滑动结束的时候</span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;/summary&gt;</span></span></span><br><span class="line">        <span class="comment"><span class="doctag">///</span> <span class="doctag">&lt;param name=&quot;e&quot;&gt;</span><span class="doctag">&lt;/param&gt;</span></span></span><br><span class="line">        <span class="function"><span class="keyword">public</span> <span class="keyword">void</span> <span class="title">OnEndDrag</span>(<span class="params">BaseEventData e</span>)</span></span><br><span class="line">        &#123;</span><br><span class="line">            stick.localPosition = Vector3.zero;</span><br><span class="line">            onValueChange?.Invoke(Vector2.zero);</span><br><span class="line">            _isStickMode = <span class="literal">false</span>;</span><br><span class="line"></span><br><span class="line">            ResetStickBorder();</span><br><span class="line">        &#125;</span><br><span class="line"></span><br><span class="line">        <span class="function"><span class="keyword">void</span> <span class="title">ResetStickBorder</span>()</span></span><br><span class="line">        &#123;</span><br><span class="line">            stickBorderGroup.alpha = <span class="number">0.0f</span>;</span><br><span class="line">            stickBorder.position = _stickBorderInitPos;</span><br><span class="line">        &#125;</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br><span class="line"></span><br></pre></td></tr></table></figure>
